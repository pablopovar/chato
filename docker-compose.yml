x-nerdo-runtime: &nerdo-runtime
  build:
    context: .
  image: chato-nerdo:local
  restart: unless-stopped
  env_file:
    - .env
  extra_hosts:
    - "host.docker.internal:host-gateway"
  group_add:
    - "${NERDO_HOST_GID:-1000}"

services:
  nerdo:
    <<: *nerdo-runtime
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "3401"
    expose:
      - "3401"
    environment:
      NERDO_DATA_DIR: /app/data
      NERDO_USERS_DIR: /app/users
      NERDO_DEMOS_PATH: /app/demos.toml
    volumes:
      - ./data:/app/data
      - ./users:/app/users
      - ./demos.toml:/app/demos.toml:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:3401/health", timeout=3).read()
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 10s

  nerdo-api:
    <<: *nerdo-runtime
    command:
      - uvicorn
      - nerdo_api.dashboard_app:app
      - --host
      - 0.0.0.0
      - --port
      - "3400"
    depends_on:
      nerdo:
        condition: service_healthy
    environment:
      NERDO_CORE_BASE_URL: "http://nerdo:3401"
      NERDO_CORE_ADMIN_TOKEN: "${NERDO_ADMIN_TOKEN:?NERDO_ADMIN_TOKEN is required}"
      NERDO_BASE_URL: http://nerdo:3401
      NERDO_ADMIN_TOKEN: "${NERDO_ADMIN_TOKEN:?NERDO_ADMIN_TOKEN is required}"
      NERDO_OPERATOR_TOKEN: "${NERDO_OPERATOR_TOKEN:?NERDO_OPERATOR_TOKEN is required}"
      NERDO_DATABASE_PATH: /app/data/nerdo-api.sqlite3
      NERDO_USERS_DIR: /app/users
      NERDO_PUBLIC_BASE_URL: "${NERDO_PUBLIC_BASE_URL:-https://nerdo.povarchik.com}"
      NERDO_DOCUMENT_FOUNDRY_BASE_URL: "${NERDO_DOCUMENT_FOUNDRY_BASE_URL:-http://host.docker.internal:3500}"
      NERDO_DOCUMENT_FOUNDRY_TIMEOUT_SECONDS: "${NERDO_DOCUMENT_FOUNDRY_TIMEOUT_SECONDS:-600}"
      NERDO_FOUNDRY_MARKDOWN_MAX_BYTES: "${NERDO_FOUNDRY_MARKDOWN_MAX_BYTES:-2000000}"
      NERDO_FOUNDRY_SOURCE_MAX_BYTES: "${NERDO_FOUNDRY_SOURCE_MAX_BYTES:-104857600}"
      NERDO_FOUNDRY_IMPORT_MAX_FILES: "${NERDO_FOUNDRY_IMPORT_MAX_FILES:-20}"
    ports:
      - "127.0.0.1:3400:3400"
      - "192.168.1.65:3400:3400"
    volumes:
      - ./data:/app/data
      - ./users:/app/users

  nerdo-mail:
    <<: *nerdo-runtime
    user: "${NERDO_HOST_UID:-1000}:${NERDO_HOST_GID:-1000}"
    command:
      - python
      - -m
      - nerdo_mail.main
    depends_on:
      nerdo:
        condition: service_healthy
      nerdo-api:
        condition: service_started
    environment:
      NERDO_CORE_BASE_URL: http://nerdo:3401
      NERDO_CORE_ADMIN_TOKEN: "${NERDO_ADMIN_TOKEN:?NERDO_ADMIN_TOKEN is required}"
      NERDO_DATABASE_PATH: /app/data/nerdo-api.sqlite3
      NERDO_MAIL_STATE_PATH: /app/data/nerdo-mail.sqlite3
      NERDO_USERS_DIR: /app/users
      NERDO_MAILDIR_ROOT: /mailbox
      NERDO_MAILDIR_INBOX: INBOX/cur
      NERDO_MAIL_POLL_SECONDS: "${NERDO_MAIL_POLL_SECONDS:-10}"
      NERDO_MAIL_STABLE_SECONDS: "${NERDO_MAIL_STABLE_SECONDS:-2}"
      NERDO_ADMIN_EMAILS: "${NERDO_ADMIN_EMAILS:-pablo@povarchik.com}"
    volumes:
      - ./data:/app/data
      - ./users:/app/users
      - /home/pablo/.thunderbird/f0pc3s1x.default/ImapMail/hq3-mx-10.povarchik-2.com:/mailbox:ro
