# Place inside the canonical chato.povarchik.com:443 virtual host.
ProxyPass        "/dashboard/" "http://192.168.1.65:3400/dashboard/"
ProxyPassReverse "/dashboard/" "http://192.168.1.65:3400/dashboard/"

<LocationMatch "^/dashboard(?:/|$)">
    AuthType Basic
    AuthName "Chato & Nerdo Dashboard"
    AuthUserFile /etc/apache2/auth/.htpasswd-swagbot
    Require valid-user
    Header always set Cache-Control "no-store"
</LocationMatch>
